[project]
name = "project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "idradi", email = "idrissiradi@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "aerich>=0.10.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "gunicorn>=26.2.0",
    "pydantic-settings>=2.16.2",
    "tortoise-orm[asyncpg]>=1.1.9",
    "uvicorn>=0.54.0",
]

[project.scripts]
project = "app:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.tortoise]
tortoise_orm = "app.db.TORTOISE_ORM"
location = "./migrations"
src_folder = "./."

[dependency-groups]
dev = [
    "black>=26.10.1",
    "flake8>=7.5.0",
    "httpx2>=2.16.0",
    "isort>=9.0.2",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
]

[tool.isort]
profile = "black"
