name: Continuous Integration and Delivery

on: [push]

env:
    IMAGE: ghcr.io/idrissiradi/summarizer

jobs:
    build:
        name: Build Docker Image
        runs-on: ubuntu-latest

        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  ref: main

            - name: Log in to GitHub Packages
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Pull image / previous images
              run: |
                  docker pull ${{ env.IMAGE }}:latest || true

            - name: Build Docker image
              run: |
                  docker build \
                    --cache-from ${{ env.IMAGE }}:latest \
                    --tag ${{ env.IMAGE }}:latest \
                    --file ./project/Dockerfile.prod \
                    "./project"

            - name: Push Docker image
              run: |
                  docker push ${{ env.IMAGE }}:latest

    test:
        name: Test Docker Image
        runs-on: ubuntu-latest
        needs: build

        permissions:
            contents: read
            packages: read

        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  ref: main

            - name: Log in to GitHub Packages
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Pull image
              run: |
                  docker pull ${{ env.IMAGE }}:latest || true

            - name: Build image
              run: |
                  docker build \
                    --cache-from ${{ env.IMAGE }}:latest \
                    --tag ${{ env.IMAGE }}:latest \
                    --file ./project/Dockerfile.prod \
                    "./project"

            - name: Run container
              run: |
                  docker run \
                    -d \
                    --name fastapi-tdd \
                    -e PORT=8765 \
                    -e ENVIRONMENT=dev \
                    -e DATABASE_URL=sqlite://sqlite.db \
                    -e DATABASE_TEST_URL=sqlite://sqlite.db \
                    -p 5003:8765 \
                    ${{ env.IMAGE }}:latest

            - name: Install requirements
              run: docker exec fastapi-tdd python3 -m pip install \
                  black==26.10.1 \
                  flake8==7.5.0 \
                  isort==9.0.2 \
                  pytest==9.2.0

            - name: Pytest
              run: docker exec fastapi-tdd python -m pytest .

            - name: Flake8
              run: docker exec fastapi-tdd python -m flake8 .

            - name: Black
              run: docker exec fastapi-tdd python -m black . --check

            - name: isort
              run: docker exec fastapi-tdd python -m isort . --check-only
